    # ----------------------------------------------------
    sandbox:
      rule: "Host(`sandbox.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "sandbox-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Qdrant Vector Search Engine (VM2: oci01-flex)
    # ----------------------------------------------------
