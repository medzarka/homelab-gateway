# ==============================================================================
# Traefik v3 Dynamic Routes Configuration
# Cross-Node & Swarm Overlay Ingress Routing
# ==============================================================================

http:
  routers:
    # --------------------------------------------------------------------------
    # LiteLLM Gateway / Proxy (OpenAI API Compatible Endpoint)
    # --------------------------------------------------------------------------
    litellm:
      rule: "Host(`litellm.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "litellm-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # LiteLLM Helper - Model Management & Control Plane
    # Protected by Authelia ForwardAuth SSO (2FA + Group: litellm-helper)
    # --------------------------------------------------------------------------
    litellm-helper:
      rule: "Host(`litellm-helper.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
      service: "litellmhelper-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Qdrant Vector Database Dashboard & Management
    # Protected by Authelia ForwardAuth SSO (2FA)
    # --------------------------------------------------------------------------
    qdrant:
      rule: "Host(`qdrant.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
      service: "qdrant-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Neo4j Graph Database Web Browser UI
    # Protected by Authelia ForwardAuth SSO (2FA)
    # --------------------------------------------------------------------------
    neo4j:
      rule: "Host(`neo4j.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
      service: "neo4j-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Mem0 Intelligent Agent Memory API
    # Protected by API Key (X-API-Key / Bearer)
    # --------------------------------------------------------------------------
    mem0:
      rule: "Host(`mem0.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "mem0-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Homelab AI Knowledge Hub MCP Server (SSE & REST API)
    # Protected by API Key (X-API-Key / Bearer)
    # --------------------------------------------------------------------------
    knowledge-mcp:
      rule: "Host(`knowledge-mcp.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "knowledge-mcp-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Homelab AI Execution Sandbox & MCP Server (Multi-Node Failover)
    # Protected by API Key (X-API-Key / Bearer)
    # --------------------------------------------------------------------------
    agent-sandbox:
      rule: "Host(`sandbox.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "agent-sandbox-svc"
      tls:
        certResolver: "cloudflare"

  # ============================================================================
  # Services (Routed over homelab_swarm_net overlay network & Tailscale)
  # ============================================================================
  services:
    litellm-svc:
      loadBalancer:
        servers:
          - url: "http://litellm:4000"

    litellmhelper-svc:
      loadBalancer:
        servers:
          - url: "http://litellm-helper:5001"

    qdrant-svc:
      loadBalancer:
        servers:
          - url: "http://qdrant:6333"

    neo4j-svc:
      loadBalancer:
        servers:
          - url: "http://neo4j:7474"

    mem0-svc:
      loadBalancer:
        servers:
          - url: "http://mem0-api:8000"

    knowledge-mcp-svc:
      loadBalancer:
        servers:
          - url: "http://knowledge-mcp:8095"

    agent-sandbox-svc:
      loadBalancer:
        healthCheck:
          path: "/health"
          interval: "5s"
          timeout: "2s"
        servers:
          # Primary: Worker Node zap-srv via Swarm Overlay DNS (No host ports mapped)
          - url: "http://agent-sandbox-zap-srv:8088"
          # Failover: Worker Node oci01-flex via Swarm Overlay DNS (No host ports mapped)
          - url: "http://agent-sandbox-oci01-flex:8088"
