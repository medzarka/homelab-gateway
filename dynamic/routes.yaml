http:
  routers:
    # ----------------------------------------------------
    # Authelia - Centralized SSO Authentication Portal
    # ----------------------------------------------------
    authelia:
      rule: "Host(`auth.example.com`, `authelia.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "authelia-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Homepage - Unified Homelab Portal & Service Cockpit (SSO Protected)
    # ----------------------------------------------------
    homepage:
      rule: "Host(`homelab.example.com`, `hub.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "homepage-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Beszel - Cluster Telemetry & Bandwidth Metrics (SSO 2FA Protected)
    # ----------------------------------------------------
    beszel:
      rule: "Host(`metrics.example.com`, `beszel.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "beszel-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Dozzle - Centralized Multi-Node Container Log Viewer (SSO Protected)
    # ----------------------------------------------------
    dozzle:
      rule: "Host(`logs.example.com`, `dozzle.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers"]
      service: "dozzle-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Uptime Kuma - Multi-Node Status & Health Alerts
    # ----------------------------------------------------
    uptime-kuma:
      rule: "Host(`status.example.com`, `uptimekuma.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "uptimekuma-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Traefik Web Dashboard & Visual Monitoring GUI (SSO 2FA Protected)
    # ----------------------------------------------------
    traefik-dashboard:
      rule: "Host(`traefik.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers", "compression"]
      service: "api@internal"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Shortcut: /arcane -> Dedicated Arcane Domain
    # ----------------------------------------------------
    arcane-redirect:
      rule: "Host(`homelab.example.com`, `hub.example.com`) && (Path(`/arcane`) || PathPrefix(`/arcane/`))"
      entryPoints: ["websecure"]
      middlewares: ["to-arcane-domain"]
      service: "noop@internal"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Arcane Docker Management Cockpit (VM1: zap-vps)
    # ----------------------------------------------------
    arcane:
      rule: "Host(`arcane.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "arcane-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # LiteLLM AI Gateway (VM2: oci01-flex)
    # ----------------------------------------------------
    litellm:
      rule: "Host(`litellm.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "litellm-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Open-WebUI (VM2: oci01-flex)
    # ----------------------------------------------------
    open-webui:
      rule: "Host(`open-webui.example.com`, `chat.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers", "compression"]
      service: "openwebui-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # LiteLLM Helper (VM2: oci01-flex)
    # ----------------------------------------------------
    litellm-helper:
      rule: "Host(`litellm-helper.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "litellmhelper-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Hermes Agent Dashboard & Gateway (VM2: oci01-flex)
    # ----------------------------------------------------
    hermes:
      rule: "Host(`hermes.example.com`, `agents.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers"]
      service: "hermes-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # Homelab AI Knowledge Hub MCP Server (VM2: oci01-flex)
    # ----------------------------------------------------
    knowledge-mcp:
      rule: "Host(`knowledge-mcp.example.com`, `knowledge.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "knowledge-mcp-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
