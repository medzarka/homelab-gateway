# ==============================================================================
# Traefik v3 Dynamic Routes Configuration
# Cross-Node & Swarm Overlay Ingress Routing
# ==============================================================================

http:
  routers:
    # --------------------------------------------------------------------------
    # LiteLLM Gateway / Proxy (OpenAI API Compatible Endpoint)
    # --------------------------------------------------------------------------
    litellm:
      rule: "Host(`litellm.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "litellm-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # LiteLLM Helper - Model Management & Control Plane
    # Protected by Authelia ForwardAuth SSO (2FA + Group: litellm-helper)
    # --------------------------------------------------------------------------
    litellm-helper:
      rule: "Host(`litellm-helper.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
      service: "litellmhelper-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Qdrant Vector Database Dashboard & Management
    # Protected by Authelia ForwardAuth SSO (2FA)
    # --------------------------------------------------------------------------
    qdrant:
      rule: "Host(`qdrant.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
      service: "qdrant-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Neo4j Graph Database Web Browser UI
    # Protected by Authelia ForwardAuth SSO (2FA)
    # --------------------------------------------------------------------------
    neo4j:
      rule: "Host(`neo4j.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
      service: "neo4j-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Mem0 Intelligent Agent Memory API
    # Protected by API Key (X-API-Key / Bearer)
    # --------------------------------------------------------------------------
    mem0:
      rule: "Host(`mem0.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "mem0-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Homelab AI Knowledge Hub MCP Server (SSE & REST API)
    # Protected by API Key (X-API-Key / Bearer)
    # --------------------------------------------------------------------------
    knowledge-mcp:
      rule: "Host(`knowledge-mcp.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "knowledge-mcp-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Homelab AI Execution Sandbox & MCP Server (Multi-Node Failover)
    # Protected by API Key (X-API-Key / Bearer)
    # --------------------------------------------------------------------------
    agent-sandbox:
      rule: "Host(`sandbox.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "agent-sandbox-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # SearXNG Private Search Engine
    # --------------------------------------------------------------------------
    searxng:
      rule: "Host(`search.example.com`) || Host(`searxng.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "searxng-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Speaches OpenAI-Compatible STT & TTS Engine
    # --------------------------------------------------------------------------
    speaches:
      rule: "Host(`audio.example.com`) || Host(`voice.example.com`) || Host(`speaches.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "speaches-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Firecrawl Web Scraper & Crawler
    # --------------------------------------------------------------------------
    firecrawl:
      rule: "Host(`scraper.example.com`) || Host(`firecrawl.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "firecrawl-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Ollama Local LLM & Vision Engine
    # --------------------------------------------------------------------------
    ollama:
      rule: "Host(`ollama.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "ollama-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # OnlyOffice Document Server (Single-User Lean Edition)
    # --------------------------------------------------------------------------
    onlyoffice:
      rule: "Host(`onlyoffice.example.com`) || Host(`onlyoffice-doc-server.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "onlyoffice-headers"
      service: "onlyoffice-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # HuggingFace TEI Embeddings & Reranker Inference
    # --------------------------------------------------------------------------
    embeddings:
      rule: "Host(`embeddings.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "embeddings-svc"
      tls:
        certResolver: "cloudflare"

    reranker:
      rule: "Host(`reranker.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "reranker-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Open-WebUI AI Chat & Exploration Hub
    # --------------------------------------------------------------------------
    open-webui:
      rule: "Host(`open-webui.example.com`) || Host(`chat.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
        - "compression"
      service: "open-webui-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Hermes Agent Dashboard & Gateway
    # --------------------------------------------------------------------------
    hermes:
      rule: "Host(`agents.example.com`) || Host(`hermes.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
      service: "hermes-dashboard-svc"
      tls:
        certResolver: "cloudflare"

    hermes-api:
      rule: "Host(`hermes-api.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "app-fail2ban"
        - "security-headers"
      service: "hermes-api-svc"
      tls:
        certResolver: "cloudflare"

    # --------------------------------------------------------------------------
    # Hermes Agent Workspace & Output File Manager
    # --------------------------------------------------------------------------
    filebrowser:
      rule: "Host(`files-agents.example.com`) || Host(`workspace.example.com`)"
      entryPoints: ["websecure"]
      middlewares:
        - "authelia-sso"
        - "app-fail2ban"
        - "security-headers"
        - "compression"
      service: "filebrowser-svc"
      tls:
        certResolver: "cloudflare"

  # ============================================================================
  # Services (Routed over homelab_swarm_net overlay network & Tailscale)
  # ============================================================================
  services:
    litellm-svc:
      loadBalancer:
        servers:
          - url: "http://litellm:4000"

    litellmhelper-svc:
      loadBalancer:
        servers:
          - url: "http://litellm-helper:5001"

    qdrant-svc:
      loadBalancer:
        servers:
          - url: "http://qdrant:6333"

    neo4j-svc:
      loadBalancer:
        servers:
          - url: "http://neo4j:7474"

    mem0-svc:
      loadBalancer:
        servers:
          - url: "http://mem0-api:8000"

    knowledge-mcp-svc:
      loadBalancer:
        servers:
          - url: "http://knowledge-mcp:8095"

    agent-sandbox-svc:
      loadBalancer:
        healthCheck:
          path: "/health"
          interval: "5s"
          timeout: "2s"
        servers:
          # Primary: Worker Node zap-srv via Swarm Overlay DNS (No host ports mapped)
          - url: "http://agent-sandbox-zap-srv:8088"
          # Failover: Worker Node oci01-flex via Swarm Overlay DNS (No host ports mapped)
          - url: "http://agent-sandbox-oci01-flex:8088"

    searxng-svc:
      loadBalancer:
        servers:
          - url: "http://searxng:8080"

    speaches-svc:
      loadBalancer:
        servers:
          - url: "http://speaches:8000"

    firecrawl-svc:
      loadBalancer:
        servers:
          - url: "http://firecrawl-api:3036"

    ollama-svc:
      loadBalancer:
        servers:
          - url: "http://ollama:11434"

    onlyoffice-svc:
      loadBalancer:
        servers:
          - url: "http://onlyoffice:80"

    embeddings-svc:
      loadBalancer:
        servers:
          - url: "http://embeddings:80"

    reranker-svc:
      loadBalancer:
        servers:
          - url: "http://reranker:80"

    open-webui-svc:
      loadBalancer:
        servers:
          - url: "http://open-webui:8080"

    hermes-dashboard-svc:
      loadBalancer:
        servers:
          - url: "http://hermes-agent:9119"

    hermes-api-svc:
      loadBalancer:
        servers:
          - url: "http://hermes-agent:8642"

    filebrowser-svc:
      loadBalancer:
        servers:
          - url: "http://hermes_filebrowser:8080"

