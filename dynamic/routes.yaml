    # ----------------------------------------------------
    seafile:
      rule: "Host(`mycloud.example.com`, `seafile.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "security-headers"]
      service: "seafile-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
    # OnlyOffice Document Server (VM3: Compute Node)
    # ----------------------------------------------------
    onlyoffice:
      rule: "Host(`onlyoffice.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["app-fail2ban", "onlyoffice-headers"]
      service: "onlyoffice-svc"
      tls:
        certResolver: "cloudflare"

    # ----------------------------------------------------
