    # ----------------------------------------------------
    # Jellyfin Media Streaming (VM2: oci01-flex)
    # ----------------------------------------------------
    jellyfin:
      rule: "Host(`jellyfin.example.com`, `media.example.com`, `stream.example.com`)"
