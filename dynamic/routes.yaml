    knowledge-mcp-svc:
      loadBalancer:
        servers:
          - url: "http://knowledge-mcp:8095"

    sandbox-svc:
      loadBalancer:
        servers:
          - url: "http://compute_agent_sandbox:8088"
        healthCheck:
          path: "/health"
          interval: "10s"
          timeout: "3s"

    qdrant-svc:
      loadBalancer:
        servers:
          - url: "http://qdrant:6333"

    mem0-svc:
      loadBalancer:
        servers:
          - url: "http://mem0-api:8000"

    neo4j-svc:
      loadBalancer:
        servers:
          - url: "http://neo4j:7474"

    searxng-svc:
      loadBalancer:
        servers:
          - url: "http://compute_searxng:8080"

    firecrawl-svc:
      loadBalancer:
        servers:
          - url: "http://compute_firecrawl_api:3036"

    speaches-svc:
      loadBalancer:
        servers:
          - url: "http://compute_speaches:8000"

    ollama-svc:
      loadBalancer:
        servers:
          - url: "http://compute_ollama:11434"

    jupyter-svc:
      loadBalancer:
        servers:
          - url: "http://jupyter:8888"

    codeserver-svc:
      loadBalancer:
        servers:
          - url: "http://code-server:8443"

    seafile-svc:
      loadBalancer:
        servers:
          - url: "http://seafile:80"

    immich-svc:
      loadBalancer:
        servers:
          - url: "http://immich_server:2283"

    lldap-svc:
      loadBalancer:
        servers:
          - url: "http://lldap:17170"

    onlyoffice-svc:
      loadBalancer:
        servers:
          - url: "http://compute_onlyoffice:80"

