    # ----------------------------------------------------
    # qBittorrent WebUI (VM2: oci01-flex)
    # ----------------------------------------------------
    qbittorrent:
      rule: "Host(`torrents.example.com`, `torrent.example.com`, `qbittorrent.example.com`)"
      entryPoints: ["websecure"]
      middlewares: ["authelia-sso", "app-fail2ban", "security-headers"]
      service: "qbittorrent-svc"
      tls:
        certResolver: "cloudflare"

  services:
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:80"

    authelia-svc:
      loadBalancer:
        servers:
          - url: "http://authelia:9091"

    homepage-svc:
      loadBalancer:
        servers:
          - url: "http://homepage:3000"

    beszel-svc:
      loadBalancer:
        servers:
          - url: "http://beszel:8090"

    dozzle-svc:
      loadBalancer:
        servers:
          - url: "http://dozzle:8080"

    uptimekuma-svc:
      loadBalancer:
        servers:
          - url: "http://uptime_kuma:3001"

    arcane-svc:
      loadBalancer:
        servers:
          - url: "http://arcane:3552"

    litellm-svc:
      loadBalancer:
        servers:
          - url: "http://litellm:4000"

    openwebui-svc:
      loadBalancer:
        servers:
          - url: "http://open-webui:8080"

    litellmhelper-svc:
      loadBalancer:
        servers:
          - url: "http://litellm-helper:5001"

    hermes-svc:
      loadBalancer:
        servers:
