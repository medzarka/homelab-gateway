---
# ==============================================================================
# AUTHELIA CONFIGURATION (https://www.authelia.com/configuration/)
# ==============================================================================

server:
  address: "tcp://0.0.0.0:9091"
  asset_path: "/config/assets"
  buffers:
    read: 65536
    write: 65536
  endpoints:
    authz:
      forward-auth:
        implementation: "ForwardAuth"
        authn_strategies:
          - name: "CookieSession"

log:
  level: "info"

theme: "dark"

regulation:
  max_retries: 10
  find_time: "2m"
  ban_time: "5m"

identity_validation:
  reset_password:
    jwt_secret: "__AUTHELIA_JWT_SECRET__"

authentication_backend:
  password_reset:
    disable: false
  ldap:
    implementation: "lldap"
    address: "ldap://lldap:3890"
    timeout: 5s
    start_tls: false
    base_dn: "dc=example,dc=com"
    additional_users_dn: "ou=people"
    users_filter: "(&({username_attribute}={input})(objectClass=person))"
    additional_groups_dn: "ou=groups"
    groups_filter: "(member={dn})"
    user: "uid=__AUTHELIA_LDAP_USER__,ou=people,dc=example,dc=com"
    password: "__AUTHELIA_LDAP_PASSWORD__"

session:
  name: "authelia_session"
  secret: "__AUTHELIA_SESSION_SECRET__"
  expiration: "1w"
  inactivity: "24h"
  remember_me: "1w"
  cookies:
    - domain: "example.com"
      authelia_url: "https://auth.example.com"
      default_redirection_url: "https://homelab.example.com"

totp:
  issuer: "Homelab SSO"
  period: 30
  skew: 1

storage:
  encryption_key: "__AUTHELIA_STORAGE_KEY__"
  local:
    path: "/config/data/db.sqlite3"

notifier:
  disable_startup_check: true
  smtp: {}

access_control:
  default_policy: "deny"
  rules:
    # --------------------------------------------------------------------------
    # 1. Direct Access / Public Endpoints (Bypass SSO)
    # --------------------------------------------------------------------------
    # Includes: immich, seafile, authelia, lldap
    - domain_regex: "^(auth|authelia|photos|immich|mycloud|seafile|lldap)\\..+$"
      policy: "bypass"

    # --------------------------------------------------------------------------
    # 2. AI Agents & Chat (2-Factor: Strictly group 'ai-agents')
    # --------------------------------------------------------------------------
    # Includes: hermes agents, open-webui
    - domain_regex: "^(hermes|hermes-api|agents|open-webui|chat)\\..+$"
      policy: "two_factor"
      subject:
        - "group:ai-agents"

    # --------------------------------------------------------------------------
    # 3. AI Backend Tools (2-Factor: Strictly group 'ai-admins')
    # --------------------------------------------------------------------------
    # Includes: litellm, litellm-helper, embedding, ollama, reranker, mem0, qdrant, neo4j, mcp sandbox, mcp knowledge, searxng, speaches, firecrawl
    - domain_regex: "^(litellm|litellm-helper|embeddings|ollama|reranker|mem0|qdrant|neo4j|sandbox|knowledge-mcp|search|searxng|audio|voice|speaches|scraper|firecrawl)\\..+$"
      policy: "two_factor"
      subject:
        - "group:ai-tools"

    # --------------------------------------------------------------------------
    # 4. Infrastructure & Monitoring (2-Factor: Admins only)
    # --------------------------------------------------------------------------
    # Includes: traefik, arcane, beszel (metrics), dozzle (logs), onlyoffice, kuma
    - domain_regex: "^(traefik|arcane|beszel|metrics|dozzle|logs|onlyoffice|onlyoffice-doc-server|kuma)\\..+$"
      policy: "two_factor"
      subject:
        - "group:ai-admins"
        - "group:ai_admins"
        - "group:homelab_admins"

    # --------------------------------------------------------------------------
    # 5. General Dashboard (2-Factor: All Authenticated Users)
    # --------------------------------------------------------------------------
    # Includes: homelab, hub
    - domain_regex: "^(homelab|hub)\\..+$"
      policy: "two_factor"

identity_providers:
  oidc:
    jwks:
      - key_id: "homelab-main"
        algorithm: "RS256"
        use: "sig"
        key: |
__AUTHELIA_OIDC_JWKS_KEY__

    authorization_policies:
      immich_policy:
        default_policy: "deny"
        rules:
          - policy: "two_factor"
            subject:
              - "group:media_users"
              - "group:homelab_admins"

      seafile_policy:
        default_policy: "deny"
        rules:
          - policy: "two_factor"
            subject:
              - "group:cloud_users"
              - "group:homelab_admins"

    clients:
      - client_id: "immich"
        client_name: "Immich"
        client_secret: "__AUTHELIA_IMMICH_SECRET_HASH__"
        public: false
        authorization_policy: "immich_policy"
        consent_mode: "implicit"
        require_pkce: true
        pkce_challenge_method: "S256"
        redirect_uris:
          - "https://photos.example.com/auth/login"
          - "https://photos.example.com/user-settings"
          - "app.immich:///oauth-callback"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        token_endpoint_auth_method: "client_secret_post"

      - client_id: "seafile"
        client_name: "Seafile"
        client_secret: "__AUTHELIA_SEAFILE_SECRET_HASH__"
        public: false
        authorization_policy: "seafile_policy"
        consent_mode: "implicit"
        require_pkce: false
        redirect_uris:
          - "https://mycloud.example.com/oauth/callback/"
          - "https://seafile.example.com/oauth/callback/"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        access_token_signed_response_alg: "none"
        userinfo_signed_response_alg: "none"
        token_endpoint_auth_method: "client_secret_basic"
