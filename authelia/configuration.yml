---
# ==============================================================================
# AUTHELIA CONFIGURATION (https://www.authelia.com/configuration/)
# ==============================================================================

server:
  address: "tcp://0.0.0.0:9091"
  asset_path: "/config/assets"
  buffers:
    read: 65536
    write: 65536
  endpoints:
    authz:
      forward-auth:
        implementation: "ForwardAuth"
        authn_strategies:
          - name: "CookieSession"

log:
  level: "info"

theme: "dark"

regulation:
  max_retries: 10
  find_time: "2m"
  ban_time: "5m"

identity_validation:
  reset_password:
    jwt_secret: "__AUTHELIA_JWT_SECRET__"

authentication_backend:
  password_reset:
    disable: false
  ldap:
    implementation: "lldap"
    address: "ldap://lldap:3890"
    timeout: 5s
    start_tls: false
    base_dn: "dc=example,dc=com"
    additional_users_dn: "ou=people"
    users_filter: "(&({username_attribute}={input})(objectClass=person))"
    additional_groups_dn: "ou=groups"
    groups_filter: "(member={dn})"
    user: "uid=__AUTHELIA_LDAP_USER__,ou=people,dc=example,dc=com"
    password: "__AUTHELIA_LDAP_PASSWORD__"

session:
  name: "authelia_session"
  secret: "__AUTHELIA_SESSION_SECRET__"
  expiration: "1w"
  inactivity: "24h"
  remember_me: "1w"
  cookies:
    - domain: "example.com"
      authelia_url: "https://auth.example.com"
      default_redirection_url: "https://homelab.example.com"

totp:
  issuer: "Homelab SSO"
  period: 30
  skew: 1

storage:
  encryption_key: "__AUTHELIA_STORAGE_KEY__"
  local:
    path: "/config/data/db.sqlite3"

notifier:
  disable_startup_check: true
  smtp: {}

access_control:
  default_policy: "deny"
  rules:
    # --------------------------------------------------------------------------
    # 1. Public Endpoints & APIs (Bypass SSO)
    # --------------------------------------------------------------------------
    - domain_regex: "^(auth|test1)\\..+$"
      policy: "bypass"

    - domain_regex: "^(photos|mycloud|seafile)\\..+$"
      resources:
        - "^/api/.*$"
        - "^/api2/.*$"
        - "^/seafhttp/.*$"
      policy: "bypass"

    # --------------------------------------------------------------------------
    # 2. Portal & Dashboards (1-Factor: Username + Password)
    # --------------------------------------------------------------------------
    - domain_regex: "^(homelab|hub|logs|status|test2)\\..+$"
      policy: "one_factor"

    # --------------------------------------------------------------------------
    # 3. Critical Infrastructure Cockpits (2-Factor: Password + TOTP 2FA)
    # --------------------------------------------------------------------------
    - domain_regex: "^(traefik|metrics|beszel|arcane|test3)\\..+$"
      policy: "two_factor"

identity_providers:
  oidc:
    jwks:
      - key_id: "homelab-main"
        algorithm: "RS256"
        use: "sig"
        key: |
__AUTHELIA_OIDC_JWKS_KEY__

    authorization_policies:
      immich_policy:
        default_policy: "deny"
        rules:
          - policy: "two_factor"
            subject:
              - "group:media_users"
              - "group:homelab_admins"

      seafile_policy:
        default_policy: "deny"
        rules:
          - policy: "two_factor"
            subject:
              - "group:cloud_users"
              - "group:homelab_admins"

    clients:
      - client_id: "immich"
        client_name: "Immich"
        client_secret: "__AUTHELIA_IMMICH_SECRET_HASH__"
        public: false
        authorization_policy: "immich_policy"
        require_pkce: true
        pkce_challenge_method: "S256"
        redirect_uris:
          - "https://photos.example.com/auth/login"
          - "https://photos.example.com/user-settings"
          - "app.immich:///oauth-callback"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        token_endpoint_auth_method: "client_secret_post"

      - client_id: "seafile"
        client_name: "Seafile"
        client_secret: "__AUTHELIA_SEAFILE_SECRET_HASH__"
        public: false
        authorization_policy: "seafile_policy"
        require_pkce: false
        redirect_uris:
          - "https://mycloud.example.com/oauth/callback/"
          - "https://seafile.example.com/oauth/callback/"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        access_token_signed_response_alg: "none"
        userinfo_signed_response_alg: "none"
        token_endpoint_auth_method: "client_secret_basic"
