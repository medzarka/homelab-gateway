---
# ==============================================================================
# AUTHELIA CONFIGURATION (https://www.authelia.com/configuration/)
# ==============================================================================

server:
  address: "tcp://0.0.0.0:9091"
  asset_path: "/config/assets"
  buffers:
    read: 65536
    write: 65536
  endpoints:
    authz:
      forward-auth:
        implementation: "ForwardAuth"
        authn_strategies:
          - name: "CookieSession"

log:
  level: "info"

theme: "dark"

regulation:
  max_retries: 10
  find_time: "2m"
  ban_time: "5m"

identity_validation:
  reset_password:
    jwt_secret: "d990cd84cd49d8264cc6962552f30cc30e9d9388a2f9382bf8bfd61dc458ea06"

authentication_backend:
  password_reset:
    disable: false
  ldap:
    implementation: "lldap"
    address: "ldap://lldap:3890"
    timeout: 5s
    start_tls: false
    base_dn: "dc=example,dc=com"
    additional_users_dn: "ou=people"
    users_filter: "(&({username_attribute}={input})(objectClass=person))"
    additional_groups_dn: "ou=groups"
    groups_filter: "(member={dn})"
    user: "uid=__AUTHELIA_LDAP_USER__,ou=people,dc=example,dc=com"
    password: "__AUTHELIA_LDAP_PASSWORD__"

session:
  name: "authelia_session"
  secret: "88e41276bc5fd92ee8d638c9ed85e0cddfef274fe7165a6914a841b2f9d536ea"
  expiration: "1w"
  inactivity: "24h"
  remember_me: "1w"
  cookies:
    - domain: "example.com"
      authelia_url: "https://auth.example.com"
      default_redirection_url: "https://homelab.example.com"

totp:
  issuer: "Homelab SSO"
  period: 30
  skew: 1

storage:
  encryption_key: "74f4ff3849ef73c3f3545cfd214a58bf0ed376250da6cdb32e458bf5d27e33aa"
  local:
    path: "/config/data/db.sqlite3"

notifier:
  disable_startup_check: true
  smtp: {}

access_control:
  default_policy: "deny"
  rules:
    # --------------------------------------------------------------------------
    # 1. Public Endpoints & APIs (Bypass SSO)
    # --------------------------------------------------------------------------
    - domain_regex: "^auth\\..+$"
      policy: "bypass"

    - domain_regex: "^(photos|mycloud|seafile)\\..+$"
      resources:
        - "^/api/.*$"
        - "^/api2/.*$"
        - "^/seafhttp/.*$"
      policy: "bypass"

    # --------------------------------------------------------------------------
    # 2. Portal & Dashboards (1-Factor: Username + Password)
    # --------------------------------------------------------------------------
    - domain_regex: "^(homelab|hub|logs|status)\\..+$"
      policy: "one_factor"

    # --------------------------------------------------------------------------
    # 3. Critical Infrastructure Cockpits (2-Factor: Password + TOTP 2FA)
    # --------------------------------------------------------------------------
    - domain_regex: "^(traefik|metrics|beszel|arcane)\\..+$"
      policy: "two_factor"

