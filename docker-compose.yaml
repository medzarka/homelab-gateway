services:

  # ========================================================
  # STORAGE & CONFIG HELPER (Automated Domain & Permissions Guard)
  # ========================================================
  storage-init:
    image: alpine:latest
    container_name: gateway_storage_init
    user: "0:0"
    restart: unless-stopped
    networks:
      - shared_net
      - homelab_swarm_net
    environment:
      - ROOT_DOMAIN=${ROOT_DOMAIN:-example.com}
      - LLDAP_ADMIN_USER=${LLDAP_ADMIN_USER:-admin}
      - LLDAP_ADMIN_PASSWORD=${LLDAP_ADMIN_PASSWORD:-adminpassword}
      - AUTHELIA_LDAP_USER=${AUTHELIA_LDAP_USER:-authelia}
      - AUTHELIA_LDAP_PASSWORD=${AUTHELIA_LDAP_PASSWORD:-authelia_service_secret_pass}
    volumes:
      - ${DATA_DIR:-/home/${SYSTEM_USER:-homelab}/DATA}/gateway/data:/data
      - ./authelia:/authelia_src
      - ./dynamic:/dynamic_src
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo ">>> [Storage Init] Setting up directories and permissions..."
        mkdir -p /data/traefik/logs /data/authelia /data/lldap
        touch /data/traefik/acme.json /data/traefik/logs/access.log
        chmod -R 775 /data
        chmod 600 /data/traefik/acme.json

        ROOT_DOM="$${ROOT_DOMAIN:-example.com}"
        DOMAIN_DC=$$(echo "$$ROOT_DOM" | sed 's/\./,dc=/g' | sed 's/^/dc=/')
        AUTH_USER="$${AUTHELIA_LDAP_USER:-authelia}"
        AUTH_PASS="$${AUTHELIA_LDAP_PASSWORD:-authelia_service_secret_pass}"
        ADMIN_USER="$${LLDAP_ADMIN_USER:-admin}"
        ADMIN_PASS="$${LLDAP_ADMIN_PASSWORD:-adminpassword}"
        echo ">>> [Storage Init] Interpolating ROOT_DOMAIN ($$ROOT_DOM), DOMAIN_DC ($$DOMAIN_DC), AUTH_USER ($$AUTH_USER) into runtime configs..."

        # Generate active configs from templates
        sed "s|example.com|$$ROOT_DOM|g" /authelia_src/configuration.yml | sed "s|dc=example,dc=com|$$DOMAIN_DC|g" | sed "s|__AUTHELIA_LDAP_USER__|$$AUTH_USER|g" | sed "s|__AUTHELIA_LDAP_PASSWORD__|$$AUTH_PASS|g" > /tmp/cfg.yml && cat /tmp/cfg.yml > /authelia_src/configuration.yml
        sed "s|example.com|$$ROOT_DOM|g" /dynamic_src/middleware.yaml > /tmp/mid.yml && cat /tmp/mid.yml > /dynamic_src/middleware.yaml
        sed "s|example.com|$$ROOT_DOM|g" /dynamic_src/routes.yaml > /tmp/rt.yml && cat /tmp/rt.yml > /dynamic_src/routes.yaml

        # Automatic background provisioning of authelia service user in LLDAP
        (
          apk add --no-cache openldap-clients >/dev/null 2>&1 || true
          until nc -z lldap 3890 2>/dev/null; do sleep 2; done
          sleep 2
          printf "dn: uid=%%s,ou=people,%%s\nobjectClass: person\nobjectClass: organizationalPerson\nobjectClass: inetOrgPerson\nuid: %%s\ncn: %%s\nsn: Service\nmail: %%s@%%s\nuserPassword: %%s\n" "$$AUTH_USER" "$$DOMAIN_DC" "$$AUTH_USER" "$$AUTH_USER" "$$AUTH_USER" "$$ROOT_DOM" "$$AUTH_PASS" > /tmp/authelia.ldif
          ldapadd -x -H ldap://lldap:3890 -D "uid=$$ADMIN_USER,ou=people,$$DOMAIN_DC" -w "$$ADMIN_PASS" -f /tmp/authelia.ldif 2>/dev/null || true
          ldappasswd -x -H ldap://lldap:3890 -D "uid=$$ADMIN_USER,ou=people,$$DOMAIN_DC" -w "$$ADMIN_PASS" -s "$$AUTH_PASS" "uid=$$AUTH_USER,ou=people,$$DOMAIN_DC" 2>/dev/null || true
          echo ">>> [Storage Init] LLDAP automated user provisioning complete."
        ) &

        echo ">>> [Storage Init] Runtime configs generated. Storage guard active."
        sleep infinity

  # ========================================================
  # DOCKER SOCKET PROXY (Read-Only Secure Socket Isolation)
  # ========================================================
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: gateway_socket_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - NODES=1
      - SWARM=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      - PING=1
      - POST=0
      - DELETE=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # LLDAP (Lightweight LDAP Directory & User Management GUI)
  # ========================================================
  lldap:
    image: lldap/lldap:stable-alpine
    container_name: lldap
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-/home/${SYSTEM_USER:-homelab}/DATA}/gateway/data/lldap:/data
    environment:
      - TZ=${TZ:-UTC}
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET:-7e6e77fd47866c85542587ea39835c21547309cbaf36c1aeb1dedebf32419040}
      - LLDAP_KEY_SEED=${LLDAP_KEY_SEED:-9fdbc3c0caa6483cc5f1f354a40068438b44e35ced217c8f0e90697376e49e3d}
      - LLDAP_LDAP_BASE_DN=${LLDAP_BASE_DN:-dc=example,dc=com}
      - LLDAP_LDAP_USER_DN=${LLDAP_ADMIN_USER:-admin}
      - LLDAP_LDAP_USER_PASS=${LLDAP_ADMIN_PASSWORD:-adminpassword}
      - LLDAP_DATABASE_URL=sqlite:///data/users.db?mode=rwc
      - LLDAP_HTTP_URL=https://lldap.${ROOT_DOMAIN:-example.com}
      - LLDAP_LDAP_PORT=3890
      - LLDAP_HTTP_PORT=17170
    networks:
      - shared_net
      - homelab_swarm_net
    healthcheck:
      test: [ "CMD", "/app/lldap", "healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # AUTHELIA (Centralized SSO & 2FA Authentication Server)
  # ========================================================
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml
      - ./authelia/users_database.yml:/config/users_database.yml
      - ./authelia/assets:/config/assets
      - ${DATA_DIR:-/home/${SYSTEM_USER:-homelab}/DATA}/gateway/data/authelia:/config/data
    environment:
      - TZ=${TZ:-UTC}
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD=${AUTHELIA_LDAP_PASSWORD:-authelia_service_secret_pass}
      - AUTHELIA_NOTIFIER_SMTP_ADDRESS=smtp://${SMTP_SERVER:-smtp.gmail.com}:${SMTP_PORT:-587}
      - AUTHELIA_NOTIFIER_SMTP_USERNAME=${SMTP_USERNAME}
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD=${SMTP_PASSWORD}
      - AUTHELIA_NOTIFIER_SMTP_SENDER=${SMTP_SENDER:-Authelia <authelia@${ROOT_DOMAIN:-example.com}>}
    networks:
      - shared_net
      - homelab_swarm_net
    depends_on:
      lldap:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:9091/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # TRAEFIK V3 (Edge Ingress, SSL & Fail2Ban Protection)
  # ========================================================
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CF_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - ACME_EMAIL=${ACME_EMAIL}
      - DOCKER_API_VERSION=1.45
    volumes:
      - ${DATA_DIR:-/home/${SYSTEM_USER:-homelab}/DATA}/gateway/data/traefik/acme.json:/etc/traefik/acme.json
      - ${DATA_DIR:-/home/${SYSTEM_USER:-homelab}/DATA}/gateway/data/traefik/logs:/var/log/traefik
      - ./dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.tls.certResolver=cloudflare"
      - "--entryPoints.websecure.http.tls.domains[0].main=${ROOT_DOMAIN:-example.com}"
      - "--entryPoints.websecure.http.tls.domains[0].sans=*.${ROOT_DOMAIN:-example.com}"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      - "--certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme.json"
      - "--experimental.plugins.fail2ban.modulename=github.com/tomMoulard/fail2ban"
      - "--experimental.plugins.fail2ban.version=v0.9.0"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--log.level=INFO"
    networks:
      - homelab_swarm_net
      - shared_net
      - socket_proxy
    depends_on:
      - socket-proxy
      - authelia
      - lldap
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  homelab_swarm_net:
    name: ${SWARM_NETWORK:-homelab_swarm_net}
    external: true
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
  socket_proxy:
    name: gateway_socket_proxy_net
    internal: true
